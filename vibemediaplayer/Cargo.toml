[workspace]
resolver = "2"
members = [
    "crates/vmp-vap",
    "crates/vmp-dsp",
    "crates/vmp-core",
    "crates/vmp-audio",
    "crates/vmp-v01d",
    "crates/vmp-cli",
    "crates/vmp-viz",
    "crates/vmp-vinyl",
    "apps/vmp-tauri/src-tauri",
    "fute",
]
default-members = [
    "crates/vmp-vap",
    "crates/vmp-dsp",
    "crates/vmp-core",
    "crates/vmp-audio",
    "crates/vmp-v01d",
    "crates/vmp-cli",
    "crates/vmp-viz",
    "crates/vmp-vinyl",
    "fute",
]
# vmp-tauri is a workspace member for path deps; build with `npm run tauri:dev`

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aurphyx/vibeaudio"
authors = ["Aurphyx / rAE"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
