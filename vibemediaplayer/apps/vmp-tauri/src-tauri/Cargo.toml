[package]
name = "vmp-tauri"
version = "0.1.0"
description = "Vibe Media Player — Tauri desktop shell"
authors = ["Aurphyx / rAE"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "vmp_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
vmp-audio = { path = "../../../crates/vmp-audio", features = ["playback"] }
vmp-vap = { path = "../../../crates/vmp-vap" }
vmp-dsp = { path = "../../../crates/vmp-dsp" }
vmp-core = { path = "../../../crates/vmp-core" }
vmp-v01d = { path = "../../../crates/vmp-v01d" }

[features]
default = []
