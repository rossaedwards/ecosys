[package]
name = "vmp-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Vibe Media Player headless CLI — probe, decode, play, VAP tag"
authors.workspace = true

[[bin]]
name = "vmp"
path = "src/main.rs"

[features]
default = ["playback"]
playback = ["vmp-audio/playback"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
vmp-audio = { path = "../vmp-audio" }
vmp-vap = { path = "../vmp-vap" }
vmp-v01d = { path = "../vmp-v01d" }
vmp-vinyl = { path = "../vmp-vinyl" }
