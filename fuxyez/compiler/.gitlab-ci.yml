# .gitlab-ci.yml
stages:
  - format
  - lint
  - build
  - test
  - deploy

variables:
  RUST_BACKTRACE: full

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - target
    - .cargo/registry
    - .cargo/git

format:
  stage: format
  image: rust:latest
  script:
    - rustup component add rustfmt
    - cargo fmt -- --check

lint:
  stage: lint
  image: rust:latest
  script:
    - rustup component add clippy
    - cargo clippy -- -D warnings

build:
  stage: build
  image: rust:latest
  script:
    - cargo build

test:
  stage: test
  image: rust:latest
  script:
    - cargo test -- --nocapture
  artifacts:
    when: always
    reports:
      junit: target/junit.xml
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deployment script placeholder"
  only:
    - master
  when: manual
  environment:
    name: production
    url: https://example.com
  artifacts:
    paths:
      - deploy.log
  expire_in: 1 week
  dependencies:
    - build
  before_script:
    - apk add --no-cache curl
  after_script:
    - echo "Deployment finished"
  tags:
    - deploy-runner
  retry: 2
  timeout: 30 minutes
  rules:
    - if: '$CI_COMMIT_TAG'
      when: always
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
    - when: never
  allow_failure: false
  parallel: 1
  resource_group: deploy-production
  interruptible: true
  release:
    name: "Release $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Release of version $CI_COMMIT_TAG"
  only:
    - tags
  except:
    - branches
  environment:
    name: production
    url: https://example.com
