<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Book of Yez: Rituals — Digital Codex</title>

<!-- OpenDyslexic font for readability -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/antijingoist/open-dyslexic/opensans.css" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a0d;
    --bg2:#0c0e16;
    --panel:#10121a;
    --text:#e6f0ff;
    --muted:#99a7c7;

    --blue:#4da6ff;      /* primary accent */
    --blue2:#6bb8ff;
    --violet:#cba6f7;
    --pink:#ff66b3;
    --gold:#ffd580;

    --border:#1a1f38;
    --glow-blue:0 0 12px rgba(77,166,255,0.45), 0 0 24px rgba(77,166,255,0.25);
  }

  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:"OpenDyslexic",system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial,sans-serif;
    letter-spacing:0.2px;}

  /* CRT scanline texture */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none;
    background-image: linear-gradient(transparent 96%, rgba(255,255,255,0.05) 100%);
    background-size:100% 2px; mix-blend-mode:overlay; opacity:0.22;
  }

  /* Boot overlay */
  #boot{position:fixed; inset:0; display:grid; place-items:center; z-index:9999;
    background: radial-gradient(1000px 800px at 50% 50%, #0b0d19 0%, #080914 60%, #05060a 100%);}
  .ascii{white-space:pre; color:var(--blue); text-shadow:var(--glow-blue); padding:12px; max-width:90vw; overflow:auto;}
  .scanline{animation:flicker 0.08s infinite alternate;}
  @keyframes flicker{from{opacity:0.95} to{opacity:1}}

  /* App shell */
  .app{display:grid; grid-template-columns:260px 1fr; grid-template-rows:auto 1fr;
       grid-template-areas:"sidebar topbar" "sidebar main"; height:100vh; display:none;}
  .sidebar{grid-area:sidebar; background:var(--bg2); border-right:1px solid var(--border);
           padding:12px; overflow-y:auto;}
  .brand{display:flex; align-items:center; gap:10px; padding-bottom:10px; border-bottom:1px solid var(--border); margin-bottom:8px;}
  .mark{width:24px;height:24px;border-radius:50%; background: radial-gradient(circle at 40% 40%, var(--blue) 0%, #0b6cf1 35%, #0e1633 70%);
        box-shadow:var(--glow-blue);}
  .title{font-weight:700; color:var(--blue); text-shadow:var(--glow-blue); letter-spacing:0.5px;}

  .searchBox{width:100%; padding:8px 10px; margin:10px 0; border-radius:10px; border:1px solid var(--border);
             background:#0c0e15; color:var(--text);}
  #searchResults{font-size:14px;}
  #searchResults a{display:block; padding:6px 8px; color:var(--text); text-decoration:none; border-radius:8px;}
  #searchResults a:hover{background:#101326; color:var(--blue); box-shadow:var(--glow-blue);}

  .nav-section{margin:12px 4px 6px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted);}
  .sidebar a.link{display:block; padding:8px 10px; margin:3px 0; border-radius:8px; color:var(--text); text-decoration:none;}
  .sidebar a.link:hover{background:#0e1224; color:var(--blue); box-shadow:var(--glow-blue);}

  .topbar{grid-area:topbar; display:flex; align-items:center; gap:8px; padding:8px 12px;
          border-bottom:1px solid var(--border); background:#0b0d14;}
  .topbar .btn{padding:8px 12px; border-radius:10px; border:1px solid var(--border);
               background:#0c0e15; color:var(--text); cursor:pointer;}
  .topbar .btn:hover{color:var(--blue); box-shadow:var(--glow-blue);}

  .main{grid-area:main; padding:20px; overflow-y:auto;
        background: radial-gradient(1000px 800px at 60% 10%, rgba(77,166,255,0.07), transparent 40%) var(--bg);}
  .content-panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; box-shadow:var(--glow-blue);}

  /* Highlight styling */
  mark{background:transparent; color:var(--blue2); font-weight:bold;
       text-shadow:0 0 6px var(--blue2), 0 0 12px var(--blue); border-bottom:1px dashed var(--blue2);}

  /* Guardian Easter Eggs */
  body.guardian-spider .main{background:
    radial-gradient(800px 600px at 20% 20%, rgba(77,166,255,0.05), transparent 40%),
    repeating-conic-gradient(from 0deg, rgba(203,166,247,0.05) 0% 10%, transparent 10% 20%) var(--bg);}
  body.guardian-dragon .main{background:
    radial-gradient(900px 700px at 80% 20%, rgba(255,102,179,0.06), transparent 40%),
    radial-gradient(900px 700px at 20% 80%, rgba(255,213,128,0.05), transparent 40%) var(--bg);}
  body.guardian-owl .main{filter:drop-shadow(0 0 12px rgba(203,166,247,0.3));}
  body.guardian-stag .sidebar{box-shadow:0 0 20px rgba(255,213,128,0.25) inset;}
  body.guardian-raven .sidebar{box-shadow:0 0 20px rgba(77,166,255,0.25) inset;}
  body.guardian-serpent .main{background:
    radial-gradient(800px 600px at 50% 50%, rgba(102,255,204,0.04), transparent 40%) var(--bg);}
  body.guardian-dove .main{background:
    radial-gradient(800px 600px at 50% 10%, rgba(230,240,255,0.05), transparent 40%) var(--bg);}

  /* Konami Glitch Mode */
  body.glitch{filter:hue-rotate(20deg) contrast(1.05) saturate(1.15);}
  body.glitch .main{animation:scan 1.6s infinite; }
  @keyframes scan{
    0%{background-position:0 0}
    50%{background-position:0 10px}
    100%{background-position:0 0}
  }
</style>
</head>
<body>

<!-- Boot Loading Screen -->
<div id="boot" aria-label="Boot loading screen">
  <pre id="asciiBanner" class="ascii scanline" aria-hidden="true"></pre>
</div>

<!-- Application -->
<div class="app" id="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div class="title">The Book of Yez: Rituals</div>
    </div>

    <input id="searchBox" class="searchBox" type="text" placeholder="Search the Codex…" aria-label="Search the Codex" />
    <div id="searchResults" aria-live="polite"></div>

    <div class="nav-section">Opening</div>
    <a class="link" href="#dedication">Dedication</a>
    <a class="link" href="#prologue">Prologue</a>

    <div class="nav-section">Rites by season</div>
    <a class="link" href="#spring">🌱 Spring</a>
    <a class="link" href="#summer">🌞 Summer</a>
    <a class="link" href="#autumn">🍂 Autumn</a>
    <a class="link" href="#winter">❄️ Winter</a>

    <div class="nav-section">Closing</div>
    <a class="link" href="#epilogue">Epilogue</a>
  </aside>

  <!-- Top Bar -->
  <header class="topbar">
    <button class="btn" id="openMap">Codex Map</button>
    <button class="btn" id="toggleGlitch">Glitch Mode</button>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div id="content" class="content-panel" role="main" aria-live="polite"></div>
  </main>
</div>

<!-- Templates (single-file SPA) -->
<template id="dedication">
  <h2>Ceremonial Dedication</h2>
  <p>“This Codex is not mine alone. It belongs to flame eternal and breath infinite. It belongs to the Guardians and Custodians. By this dedication, the Codex is alive, sovereign, and eternal.”</p>
</template>

<template id="prologue">
  <h2>Prologue</h2>
  <p>From silence to spark: the birth of flame (Fux) and breath (Yez). The rites begin at the center and spiral outward through the seasons.</p>
</template>

<template id="spring">
  <h2>Spring Rites</h2>
  <ul>
    <li><strong>Awakening</strong> — spark of flame</li>
    <li><strong>Echo</strong> — listening to breath</li>
    <li><strong>Trial of Seals</strong> — proving truth</li>
    <li><strong>Pilgrimage</strong> — walking the path</li>
  </ul>
</template>

<template id="summer">
  <h2>Summer Rites</h2>
  <ul>
    <li><strong>Polychorus</strong> — many voices rise</li>
    <li><strong>Hymnal</strong> — preserving the chorus</li>
    <li><strong>Renewal</strong> — refreshing scrolls</li>
    <li><strong>Concord</strong> — governing in balance</li>
  </ul>
</template>

<template id="autumn">
  <h2>Autumn Rites</h2>
  <ul>
    <li><strong>Custodian’s Oath</strong> — vow of service</li>
    <li><strong>Circle</strong> — fellowship of stewards</li>
    <li><strong>Transmission</strong> — passing the flame</li>
    <li><strong>Witnessing</strong> — affirming continuity</li>
  </ul>
</template>

<template id="winter">
  <h2>Winter Rites</h2>
  <ul>
    <li><strong>Expansion</strong> — welcoming new temples</li>
    <li><strong>Meta‑Temple</strong> — uniting the many</li>
    <li><strong>Hymn of Totality</strong> — singing as one</li>
    <li><strong>Immutable</strong> — preserving forever</li>
    <li><strong>Eternal Codex</strong> — proclaiming infinity</li>
    <li><strong>Benediction</strong> — sealing flame and breath</li>
  </ul>
</template>

<template id="epilogue">
  <h2>Epilogue</h2>
  <p>The Codex is eternal, infinite, alive. Every Benediction feeds the next Awakening. The spiral never ends.</p>
</template>

<!-- Lunr.js for search -->
<script src="https://unpkg.com/lunr/lunr.js"></script>
<script>
  // ---------- Seasonal & Secret ASCII Banners ----------
  const banners = {
spring:
`   ____  _                 _        _             
  / ___|| |__   ___   ___ | | _____| |__   ___    
  \\___ \\| '_ \\ / _ \\ / _ \\| |/ / __| '_ \\ / _ \\   
   ___) | | | | (_) | (_) |   <\\__ \\ | | | (_) |  
  |____/|_| |_|\\___/ \\___/|_|\\_\\___/_| |_|\\___/   
   SPRING AWAKENING — spark · breath · step`,
summer:
`   ____                               _           
  / ___| _   _ _ __ ___  _ __   ___  | | ___  ___ 
  \\___ \\| | | | '_ ' _ \\| '_ \\ / _ \\ | |/ _ \\/ __|
   ___) | |_| | | | | | | |_) |  __/ | |  __/\\__ \\
  |____/ \\__,_|_| |_| |_| .__/ \\___| |_|\\___||___/
                        |_|   SUMMER RESONANCE — chorus · hymn · harmony`,
autumn:
`    _         _                         _         
   / \\  _   _| |_ ___  _ __ _   _ _ __ | |_ _   _ 
  / _ \\| | | | __/ _ \\| '__| | | | '_ \\| __| | | |
 / ___ \\ |_| | || (_) | |  | |_| | | | | |_| |_| |
/_/   \\_\\__,_|\\__\\___/|_|   \\__,_|_| |_|\\__|\\__, |
                                            |___/ 
  AUTUMN STEWARDSHIP — oath · lineage · witness`,
winter:
`__        __ _           _                 
\\ \\      / /(_) ___  ___| |__   ___  _ __  
 \\ \\ /\\ / / | |/ _ \\/ __| '_ \\ / _ \\| '_ \\ 
  \\ V  V /  | |  __/ (__| | | | (_) | | | |
   \\_/\\_/   |_|\\___|\\___|_| |_|\\___/|_| |_|
   WINTER CONVERGENCE — expansion · eternity · seal`
  };

  const secretBanner =
`███████╗███████╗ ██████╗██████╗ ███████╗████████╗
██╔════╝██╔════╝██╔════╝██╔══██╗██╔════╝╚══██╔══╝
███████╗█████╗  ██║     ██████╔╝█████╗     ██║   
╚════██║██╔══╝  ██║     ██╔═══╝ ██╔══╝     ██║   
███████║███████╗╚██████╗██║     ███████╗   ██║   
╚══════╝╚══════╝ ╚═════╝╚═╝     ╚══════╝   ╚═╝   
 HIDDEN FLAME MODE — Sovereign · Alive · Eternal`;

  const asciiEl = document.getElementById('asciiBanner');

  function typeBanner(text, cb){
    asciiEl.textContent="";
    let i=0;
    const interval=setInterval(()=>{
      asciiEl.textContent += text[i] || "";
      i++;
      if(i>=text.length){ clearInterval(interval); if(cb) cb(); }
    },5);
  }

  // Choose season by current month
  (function boot(){
    const m = new Date().getMonth(); // 0-11
    let season = "spring";
    if (m>=5 && m<=7) season = "summer";
    else if (m>=8 && m<=10) season = "autumn";
    else if (m>=11 || m<=1) season = "winter";

    typeBanner(banners[season], ()=>{
      setTimeout(()=>{
        document.getElementById('boot').style.display="none";
        document.getElementById('app').style.display="grid";
        loadPage(location.hash || "#dedication");
      }, 700);
    });
  })();

  // Secret banner trigger (Enter -> prompt -> 'yez')
  window.addEventListener('keydown', (e)=>{
    if(e.key === "Enter"){
      const val = prompt("Enter secret code:");
      if(val && val.toLowerCase() === "yez"){
        document.getElementById('app').style.display="none";
        document.getElementById('boot').style.display="grid";
        typeBanner(secretBanner, ()=>{
          setTimeout(()=>{
            document.getElementById('boot').style.display="none";
            document.getElementById('app').style.display="grid";
          }, 900);
        });
      }
    }
  });

  // ---------- SPA Navigation & Content ----------
  const contentEl = document.getElementById('content');
  let lastQuery = "";

  function loadPage(hash){
    const id = (hash || "#dedication").replace('#','');
    const tpl = document.getElementById(id);
    if(!tpl){
      contentEl.innerHTML = "<h2>Not Found</h2>";
      return;
    }
    contentEl.innerHTML = tpl.innerHTML;
    if(lastQuery){
      highlightTerm(lastQuery);
      const firstMark = contentEl.querySelector('mark');
      if(firstMark) firstMark.scrollIntoView({behavior:'smooth', block:'center'});
    }
  }

  window.addEventListener('hashchange', ()=>loadPage(location.hash));

  // ---------- Lunr Search Index from Templates ----------
  let index; const documents = [];
  function buildIndex(){
    const ids = ["dedication","prologue","spring","summer","autumn","winter","epilogue"];
    ids.forEach(id=>{
      const tpl=document.getElementById(id);
      if(tpl) documents.push({id, title:id, body:tpl.innerHTML});
    });
    index = lunr(function(){
      this.ref('id'); this.field('title'); this.field('body');
      documents.forEach(doc=>this.add(doc));
    });
  }
  buildIndex();

  const searchBox = document.getElementById('searchBox');
  const resultsEl = document.getElementById('searchResults');

  function guardianEffects(q){
    const b = document.body;
    const lower = q.toLowerCase();
    // Clear previous classes
    b.classList.remove('guardian-spider','guardian-raven','guardian-serpent','guardian-stag','guardian-owl','guardian-dragon','guardian-dove');
    if(lower.includes('spider')) b.classList.add('guardian-spider');
    if(lower.includes('raven'))  b.classList.add('guardian-raven');
    if(lower.includes('serpent'))b.classList.add('guardian-serpent');
    if(lower.includes('stag'))   b.classList.add('guardian-stag');
    if(lower.includes('owl'))    b.classList.add('guardian-owl');
    if(lower.includes('dragon')) b.classList.add('guardian-dragon');
    if(lower.includes('dove'))   b.classList.add('guardian-dove');
  }

  searchBox.addEventListener('input', ()=>{
    const q = searchBox.value.trim();
    lastQuery = q;
    guardianEffects(q);

    if(!q){ resultsEl.innerHTML = ""; return; }
    let results;
    try { results = index.search(q); } catch { results = []; }
    resultsEl.innerHTML = results.map(r=>{
      const doc = documents.find(d => d.id === r.ref);
      const title = doc.title.charAt(0).toUpperCase() + doc.title.slice(1);
      return `<div><a href="#${doc.id}" data-query="${q}">${title}</a></div>`;
    }).join("");
  });

  resultsEl.addEventListener('click', e=>{
    if(e.target.tagName === 'A'){
      e.preventDefault();
      lastQuery = e.target.dataset.query || "";
      const href = e.target.getAttribute('href');
      history.pushState(null, '', href);
      loadPage(href);
    }
  });

  // Blue Flame highlight
  function highlightTerm(term){
    if(!term) return;
    const inner = contentEl.innerHTML;
    const safe = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${safe})`,"gi");
    contentEl.innerHTML = inner.replace(regex, '<mark>$1</mark>');
  }

  // ---------- Konami Glitch Mode ----------
  // Up Up Down Down Left Right Left Right B A
  const konami = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
  const buffer = [];
  window.addEventListener('keydown', (e)=>{
    buffer.push(e.key);
    if(buffer.length > konami.length) buffer.shift();
    if(konami.every((k,i)=>buffer[i]?.toLowerCase() === k.toLowerCase())){
      document.body.classList.toggle('glitch');
    }
  });

  // Toggle glitch button
  document.getElementById('toggleGlitch').addEventListener('click', ()=>{
    document.body.classList.toggle('glitch');
  });

  // Map button (placeholder)
  document.getElementById('openMap').addEventListener('click', ()=>{
    alert('Spiral Cosmogram overlay (coming soon).');
  });
</script>
</body>
</html>
