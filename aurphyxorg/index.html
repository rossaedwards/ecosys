<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurphyx LLC — Sovereign Computing Infrastructure</title>
    <meta name="description" content="Aurphyx LLC develops sovereign operating systems, fractal distributed storage, multimodal AI platforms, and decentralized mesh networking solutions engineered for security, resilience, and digital independence.">

    <!-- OpenDyslexic Font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@0.2.1/OpenDyslexic.min.css">

    <style>
        :root {
            --bg-main: #232946;
            --bg-section: #22223b;
            --text-color: #f2f2f2;
            --accent: #8be9fd;
        }
        body.light-mode {
            --bg-main: #f8f9fa;
            --bg-section: #ffffff;
            --text-color: #22223b;
            --accent: #667eea;
        }
        body.dyslexic-font * {
            font-family: "OpenDyslexic", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, var(--bg-main) 0%, #121629 100%);
            margin: 0;
        }
        header {
            background: rgba(20, 20, 34, 0.97);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 20px;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(45deg, #8be9fd, #9d79f2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
            align-items: center;
        }
        .nav-links a { color: var(--text-color); text-decoration: none; font-weight: 500; }
        .nav-links a:hover { color: var(--accent); }

        /* Dropdown */
        .dropdown { position: relative; }
        .dropdown-content {
            display: none;
            position: absolute;
            background: rgba(20,20,34,0.98);
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border-radius: 6px;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
        }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: #f2f2f2; padding: 12px 16px; display: block; }

        /* Controls - Phoenix style */
        .header-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .control-btn {
            background: rgba(255,255,255,0.1);
            color: var(--text-color);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            background: var(--accent);
            color: #232946;
        }

        .hamburger { display: none; flex-direction: column; cursor: pointer; gap: 4px; }
        .hamburger span { width: 25px; height: 3px; background: var(--text-color); transition: 0.3s; }

        /* Rest of your styles (hero, sections, cards, footer) remain exactly the same */
        .hero { min-height: 90vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 3rem; margin-bottom: 1rem; color: var(--accent); }
        .hero p { font-size: 1.2rem; margin-bottom: 2rem; max-width: 800px; margin-left: auto; margin-right: auto; }
        .cta-button {
            display: inline-block;
            padding: 1rem 2rem;
            border: 2px solid var(--accent);
            border-radius: 50px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .cta-button:hover { background: var(--accent); color: #232946; }

        .section { padding: 5rem 20px; background: var(--bg-section); }
        .section.alt { background: linear-gradient(135deg, var(--bg-main) 0%, #1b1464 100%); }
        .section h2 { text-align: center; font-size: 2.2rem; margin-bottom: 1.5rem; color: var(--accent); }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: linear-gradient(135deg, #232946 0%, #393e46 100%);
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        body.light-mode .card { background: #f1f1f1; color: #22223b; }

        footer {
            background: #121629;
            color: #fafaff;
            text-align: center;
            padding: 3rem 20px;
        }
        body.light-mode footer { background: #e9ecef; color: #22223b; }

        /* Mobile */
        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; position: fixed; top: 70px; left: 0; width: 100%; background: rgba(20,20,34,0.98); padding: 2rem 0; gap: 1.5rem; }
            .nav-links.active { display: flex; }
            .hamburger { display: flex; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">AURPHYX LLC</a>

            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="#technologies">Technologies</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="explorer.html">Explorer</a></li>
                <li><a href="business-compliance.html">Compliance</a></li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">Legal ▾</a>
                    <div class="dropdown-content">
                        <a href="privacy-policy.html">Privacy Policy</a>
                        <a href="terms-of-service.html">Terms of Service</a>
                    </div>
                </li>
            </ul>

            <!-- Phoenix-style controls -->
            <div class="header-controls">
                <button id="font-toggle" class="control-btn" title="Toggle Dyslexia-Friendly Font">A</button>
                <button id="theme-toggle" class="control-btn" title="Toggle Dark/Light Mode">
                    <span id="theme-icon">🌙</span>
                </button>
            </div>

            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </nav>
    </header>

    <!-- Your existing hero, sections, footer here (unchanged except for the CSS variables above) -->
    <!-- (I kept the rest of your original content exactly the same) -->

    <footer>
        <div class="footer-content"> ... your existing footer ... </div>
        <div class="footer-bottom">© 2026 Aurphyx LLC • All Rights Reserved • Erie, PA, United States</div>
    </footer>

    <script>
        // Theme toggle
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const fontToggle = document.getElementById('font-toggle');

        function setTheme(isLight) {
            if (isLight) {
                document.body.classList.add('light-mode');
                themeIcon.textContent = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                themeIcon.textContent = '🌙';
                localStorage.setItem('theme', 'dark');
            }
        }

        function setFont(isDyslexic) {
            if (isDyslexic) {
                document.body.classList.add('dyslexic-font');
                localStorage.setItem('font', 'dyslexic');
            } else {
                document.body.classList.remove('dyslexic-font');
                localStorage.setItem('font', 'standard');
            }
        }

        // Load saved preferences
        if (localStorage.getItem('theme') === 'light') setTheme(true);
        if (localStorage.getItem('font') === 'dyslexic') setFont(true);

        // Click handlers
        themeToggle.addEventListener('click', () => {
            const isLight = document.body.classList.contains('light-mode');
            setTheme(!isLight);
        });

        fontToggle.addEventListener('click', () => {
            const isDyslexic = document.body.classList.contains('dyslexic-font');
            setFont(!isDyslexic);
        });

        // Hamburger menu (unchanged)
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));
    </script>
</body>
</html>
