<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Policy - Aurphyx</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@0.2.1/OpenDyslexic.min.css">
    <style>
        :root {
            --bg-main: #232946;
            --bg-section: #22223b;
            --text-color: #f2f2f2;
            --accent: #8be9fd;
        }
        body.light-mode {
            --bg-main: #f8f9fa;
            --bg-section: #ffffff;
            --text-color: #22223b;
            --accent: #667eea;
        }
        body.dyslexic-font * { font-family: "OpenDyslexic", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif !important; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; line-height: 1.7; color: var(--text-color); background: linear-gradient(135deg, var(--bg-main) 0%, #121629 100%); margin: 0; }
        header { background: rgba(20,20,34,0.97); backdrop-filter: blur(10px); position: fixed; top: 0; left: 0; right: 0; z-index: 1000; box-shadow: 0 2px 20px rgba(0,0,0,0.5); }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 1rem 20px; }
        .logo { font-size: 2rem; font-weight: bold; background: linear-gradient(45deg, #8be9fd, #9d79f2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; list-style: none; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text-color); text-decoration: none; font-weight: 500; }
        .nav-links a:hover { color: var(--accent); }
        .dropdown { position: relative; }
        .dropdown-content { display: none; position: absolute; background: rgba(20,20,34,0.98); min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); border-radius: 6px; top: 100%; left: 50%; transform: translateX(-50%); z-index: 1000; }
        .dropdown:hover .dropdown-content { display: block; }
        .dropdown-content a { color: #f2f2f2; padding: 12px 16px; display: block; }
        .header-controls { display: flex; gap: 8px; align-items: center; }
        .control-btn { background: rgba(255,255,255,0.1); color: var(--text-color); border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; cursor: pointer; transition: all 0.3s ease; }
        .control-btn:hover { background: var(--accent); color: #232946; }
        .hamburger { display: none; flex-direction: column; cursor: pointer; gap: 4px; }
        .hamburger span { width: 25px; height: 3px; background: var(--text-color); transition: 0.3s; }
        .container { max-width: 900px; margin: 90px auto 2rem auto; padding: 2rem; background: var(--bg-section); box-shadow: 0 0 20px rgba(0,0,0,0.3); border-radius: 12px; }
        h1, h2, h3 { color: var(--accent); }
        body.light-mode .container { background: #ffffff; color: #22223b; }
        /* Original privacy styles (tables, highlights, etc.) preserved */
        .highlight { background: #e3f2fd; padding: 1.5rem; border-left: 4px solid var(--accent); margin: 1.5rem 0; border-radius: 0 5px 5px 0; }
        body.light-mode .highlight { background: #e3f2fd; }
        .data-table, .data-table th, .data-table td { border: 1px solid #dee2e6; padding: 0.75rem; }
        .data-table th { background: var(--accent); color: white; }
        footer { background: #121629; color: #fafaff; text-align: center; padding: 3rem 20px; }
        body.light-mode footer { background: #e9ecef; color: #22223b; }
        @media (max-width: 768px) {
            .nav-links { display: none; flex-direction: column; position: fixed; top: 70px; left: 0; width: 100%; background: rgba(20,20,34,0.98); padding: 2rem 0; }
            .nav-links.active { display: flex; }
            .hamburger { display: flex; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">AURPHYX LLC</a>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="#technologies">Technologies</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="explorer.html">Explorer</a></li>
                <li><a href="business-compliance.html">Compliance</a></li>
                <li class="dropdown"><a href="#" class="dropbtn">Legal ▾</a>
                    <div class="dropdown-content">
                        <a href="privacy-policy.html">Privacy Policy</a>
                        <a href="terms-of-service.html">Terms of Service</a>
                    </div>
                </li>
            </ul>
            <div class="header-controls">
                <button id="font-toggle" class="control-btn" title="Toggle Dyslexia-Friendly Font">A</button>
                <button id="theme-toggle" class="control-btn" title="Toggle Dark/Light Mode"><span id="theme-icon">🌙</span></button>
            </div>
            <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
        </nav>
    </header>

    <div class="container">
        <!-- Your original Privacy Policy content starts here (unchanged) -->
        <div class="header"><div class="logo">AURPHYX</div><h1>Privacy Policy</h1><p class="last-updated">Last Updated: August 24, 2025</p></div>
        <!-- ... full original privacy content ... -->
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>

    <footer>
        <div class="footer-bottom">© 2026 Aurphyx LLC • All Rights Reserved • Annville, PA, United States</div>
    </footer>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const fontToggle = document.getElementById('font-toggle');
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');

        function setTheme(isLight) {
            document.body.classList.toggle('light-mode', isLight);
            themeIcon.textContent = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }
        function setFont(isDyslexic) {
            document.body.classList.toggle('dyslexic-font', isDyslexic);
            localStorage.setItem('font', isDyslexic ? 'dyslexic' : 'standard');
        }

        if (localStorage.getItem('theme') === 'light') setTheme(true);
        if (localStorage.getItem('font') === 'dyslexic') setFont(true);

        themeToggle.addEventListener('click', () => setTheme(!document.body.classList.contains('light-mode')));
        fontToggle.addEventListener('click', () => setFont(!document.body.classList.contains('dyslexic-font')));
        hamburger.addEventListener('click', () => navLinks.classList.toggle('active'));
    </script>
</body>
</html>
