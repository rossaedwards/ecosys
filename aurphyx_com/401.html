<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 — Unauthorized Access | Aurphyx LLC</title>

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@0.2.1/OpenDyslexic.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #232946;
            --bg-section: #22223b;
            --text-color: #f2f2f2;
            --accent: #8be9fd;
            --accent-hover: #2dd4bf;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, #121629 100%);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: rgba(20,20,34,0.97);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 2000;
            box-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem 20px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            background: linear-gradient(45deg, #FF007F, #00F0FF);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 60px;
            text-align: center;
        }

        .error-box {
            max-width: 700px;
            padding: 3rem;
            background: rgba(20, 20, 34, 0.6);
            border: 1px solid rgba(139, 233, 253, 0.15);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.08);
        }

        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 1rem;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .error-desc {
            font-size: 1.1rem;
            color: #a0aabf;
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .home-btn {
            display: inline-block;
            padding: 1rem 2.2rem;
            border: 2px solid var(--accent);
            border-radius: 50px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .home-btn:hover {
            background: var(--accent);
            color: #121629;
        }

        footer {
            background: #121629;
            color: #fafaff;
            text-align: center;
            padding: 3rem 20px;
        }
        .sitemap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 1rem;
        }
        .sitemap a {
            color: #bdc3c7;
            text-decoration: none;
            transition: color 0.3s;
        }
        .sitemap a:hover {
            color: var(--accent);
        }
    </style>
</head>

<body>

<header>
    <nav>
        <a href="/" class="logo">AURPHYX LLC</a>
    </nav>
</header>

<div class="container">
    <div class="error-box">
        <div class="error-code">401</div>
        <div class="error-title">Unauthorized Access Attempt</div>
        <div class="error-desc">
            Authentication is required to access this node.<br>
            The Aurphyx sovereign infrastructure cannot validate your credentials.
        </div>
        <a href="/" class="home-btn">Return to Core</a>
    </div>
</div>

<footer>
    <div class="sitemap">
        <a href="/about.html">About</a> •
        <a href="/business-compliance.html">Compliance</a> •
        <a href="/privacy-policy.html">Privacy</a> •
        <a href="mailto:admin@aurphyx.com?subject=Merchant%20Gateway%20Inquiry">Funding & Merchant Gateway</a>
    </div>
</footer>

</body>
</html>
