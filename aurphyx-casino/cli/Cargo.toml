[package]
name = "aurphyx-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
aurphyx-casino = { path = ".." }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "aurphyx"
path = "src/main.rs"

