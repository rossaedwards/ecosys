[package]
name = "afs-governance"
version = "1.0.0"
authors = ["Ross Edwards & Aurphyx"]
edition = "2021"
description = "Complete governance system for AuraFS with quantum-safe identity, voting, and consensus"
license = "Apache-2.0"
repository = "https://github.com/aurphyx/aurafs-governance"

[dependencies]
tokio = { version = "1.30", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha3 = "0.10"
uuid = { version = "1.3", features = ["v4", "serde"] }
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"
clap = { version = "4.3", features = ["derive"] }
async-trait = "0.1"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3"
tower = "0.4"
axum = { version = "0.6", features = ["json", "headers"] }
tokio-util = "0.7"
tokio-stream = "0.1"
bincode = "1.3"
uuid = "1.3"

[dev-dependencies]
tokio = { version = "1.30", features = ["full"] }
