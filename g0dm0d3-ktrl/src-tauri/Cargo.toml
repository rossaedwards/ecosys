[package]
name = "g0dm0d3-ktrl"
version = "0.1.0"
description = "g0dm0d3-ktrl — Aura control deck and AI orchestration console"
authors = ["Ross A. Edwards / Aurphyx LLC"]
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "g0dm0d3_ktrl_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native", "sync-secret-service"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
ktrl-core-wasm = { path = "../core-wasm" }

[features]
default = []
